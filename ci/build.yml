name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ 1.21.1/fabric, 1.21.1/neoforge, 1.21.11/fabric, 1.21.11/neoforge ]
        artifact: [ fabric-1.21.1, neoforge-1.21.1, fabric-1.21.11, neoforge-1.21.11 ]
        exclude:
          - project: 1.21.1/fabric
            artifact: neoforge-1.21.1
          - project: 1.21.1/fabric
            artifact: fabric-1.21.11
          - project: 1.21.1/fabric
            artifact: neoforge-1.21.11
          - project: 1.21.1/neoforge
            artifact: fabric-1.21.1
          - project: 1.21.1/neoforge
            artifact: fabric-1.21.11
          - project: 1.21.1/neoforge
            artifact: neoforge-1.21.11
          - project: 1.21.11/fabric
            artifact: fabric-1.21.1
          - project: 1.21.11/fabric
            artifact: neoforge-1.21.1
          - project: 1.21.11/fabric
            artifact: neoforge-1.21.11
          - project: 1.21.11/neoforge
            artifact: fabric-1.21.1
          - project: 1.21.11/neoforge
            artifact: neoforge-1.21.1
          - project: 1.21.11/neoforge
            artifact: fabric-1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.5.1
      - name: Build
        working-directory: ${{ matrix.project }}
        run: gradle build --no-daemon --stacktrace
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyislands-${{ matrix.artifact }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
