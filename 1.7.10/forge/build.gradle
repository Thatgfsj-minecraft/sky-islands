buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}
apply plugin: 'forge'

version = '1.5.0'
group = 'dev.skyislands'
archivesBaseName = 'skyislands-forge-1.7.10'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
    // Final stable MCP mappings for the 1.7.10 line (de.oceanlabs.mcp:mcp_stable-12-1.7.10).
    mappings = 'stable_12'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

dependencies {
}

// ForgeGradle 1.2 hardcodes the dead s3.amazonaws.com/Minecraft.Download endpoints for
// the vanilla client/server/version-JSON downloads. Re-point the download tasks at
// Mojang's current (piston) endpoints so the era toolchain keeps working.
downloadClient {
    url = new net.minecraftforge.gradle.delayed.DelayedString(project, 'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar')
}
downloadServer {
    url = new net.minecraftforge.gradle.delayed.DelayedString(project, 'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// FG 1.2 also fetches the version JSON from the dead s3 endpoint; the JSON is
// only used for run-task assets, but point it at piston-meta to kill the 404.
getVersionJson {
    url = 'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json'
}
